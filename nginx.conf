server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA: enrutamiento por history fallback.
    location / {
        try_files $uri /index.html;
    }

    # Proxy a la API Go (procesamiento de matrices).
    location /process {
        proxy_pass http://go-api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Proxy a la API Node.js (autenticación).
    location /auth {
        proxy_pass http://node-api:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
